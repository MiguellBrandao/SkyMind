services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-skymind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skymind}
      POSTGRES_DB: ${POSTGRES_DB:-skymind}
    # Not published to the host by default - the `app` service reaches it over the internal
    # Docker network regardless (service name `postgres`). This avoids clashing with anything
    # else already using 5432 on a shared VPS. Uncomment to reach it from the host (e.g. a local
    # DB GUI client) - keep it bound to 127.0.0.1 if you do, never publish it on all interfaces.
    # ports:
    #   - "127.0.0.1:5432:5432"
    volumes:
      - skymind_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-skymind} -d ${POSTGRES_DB:-skymind}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Not published to the host by default - see the note on postgres above.
    # ports:
    #   - "127.0.0.1:6379:6379"
    volumes:
      - skymind_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-skymind}:${POSTGRES_PASSWORD:-skymind}@postgres:5432/${POSTGRES_DB:-skymind}
      REDIS_URL: redis://redis:6379
    # Not published to the host: the bot itself only makes outbound connections (Discord
    # gateway, Hypixel API), so it needs no inbound port. The Fastify health/admin API still
    # runs on API_PORT inside the container - if you want it reachable from outside, attach a
    # domain to this service in your hosting platform (e.g. Dokploy's Domains tab) pointing at
    # container port 3000, rather than publishing a host port here (which risks clashing with
    # other services on a shared VPS - this is exactly what broke the first deploy attempt).
    expose:
      - "3000"
    # Uses the /health endpoint internally so `docker ps` / Dokploy show real bot health even
    # though the port isn't published externally. Plain `node -e` (Node 20 has global fetch)
    # instead of curl, since the slim base image doesn't ship curl.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  skymind_postgres_data:
  skymind_redis_data:
