services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: skymind
      POSTGRES_PASSWORD: skymind
      POSTGRES_DB: skymind
    ports:
      - "5432:5432"
    volumes:
      - skymind_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skymind -d skymind"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - skymind_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://skymind:skymind@postgres:5432/skymind
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"
    profiles:
      - full

volumes:
  skymind_postgres_data:
  skymind_redis_data:
