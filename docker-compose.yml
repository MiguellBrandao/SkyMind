services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-skymind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skymind}
      POSTGRES_DB: ${POSTGRES_DB:-skymind}
    # Bound to localhost only - reachable from the host machine (e.g. a DB GUI client during
    # local dev) but never exposed to the public internet on a VPS. The `app` service always
    # reaches this over the internal Docker network regardless of this mapping.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - skymind_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-skymind} -d ${POSTGRES_DB:-skymind}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - skymind_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-skymind}:${POSTGRES_PASSWORD:-skymind}@postgres:5432/${POSTGRES_DB:-skymind}
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"

volumes:
  skymind_postgres_data:
  skymind_redis_data:
